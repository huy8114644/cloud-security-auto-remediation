name: Python SOAR Security & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    name: Lint, Typecheck & Unit Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pydantic boto3 botocore

      - name: Run Ruff Lint Check
        run: |
          python -m ruff check .

      - name: Run Mypy Static Type Analysis
        run: |
          python -m mypy src/

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest --cov=src --cov-report=term-missing tests/

  secret-and-container-scan:
    name: Gitleaks Secret & Container Audit
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        run: |
          docker run --rm -v "${PWD}:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose || true

      - name: Build Hardened Container
        run: |
          docker build -t cloud-soar-remediator:local .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloud-soar-remediator:local'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

